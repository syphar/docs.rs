name: Docker

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  docker:
    strategy:
      matrix:
        include: [
          { target: "web-server", binary: "docs_rs_web" },
          { target: "build-server", binary: "docs_rs_builder" },
          { target: "registry-watcher", binary: "docs_rs_watcher" },
          { target: "cli", binary: "docs_rs_admin" }
        ]
    name: Test Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: "./dockerfiles/Dockerfile"
          platforms: linux/amd64
          target: ${{ matrix.target }}
          tags: docs-rs-${{ matrix.target }}:ci
          build-args: |
            GIT_SHA=${{ github.sha }}
            PROFILE=release
            PROFILE_DIR=release
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

          # TODO: later we would set `push: true` and also provide nice tags
          # for the images.
          # Unclear is how the deploy would work then.

      - name: smoke test packaged binary
        run: >-
          docker run --rm
          --entrypoint /usr/local/bin/${{ matrix.binary }}
          docs-rs-${{ matrix.target }}:ci
          --help
